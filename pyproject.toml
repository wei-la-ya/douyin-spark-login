[project]
name = "douyin-spark-login"
version = "1.0.0"
description = "DouyinSpark 外置配置服务（纯 API 扫码登录 + 会话点选，插件侧 WS 回调）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "httpx>=0.24.0",
    "websockets>=12.0",
]

[project.scripts]
start = "main:start"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["main.py", "page.py", "core"]
